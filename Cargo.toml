[package]
name = "semver-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust port of rbarrois/python-semanticversion"
license = "BSD-2-Clause"

[lib]
name = "semver_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1"
once_cell = "1"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
panic = "abort"
